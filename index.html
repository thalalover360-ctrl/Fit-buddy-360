<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GymPulse AI - Squad & Coach</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { background-color: #0b0f19; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  </style>
</head>
<body class="pb-24 max-w-md mx-auto min-h-screen border-x border-slate-800 flex flex-col justify-between">

  <header class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/90 backdrop-blur sticky top-0 z-20">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center border border-emerald-500/30">
        <i class="fa-solid fa-dumbbell"></i>
      </div>
      <div>
        <h1 class="text-base font-bold text-white tracking-wide leading-tight">GymPulse AI</h1>
        <p class="text-[10px] text-emerald-400 font-medium">Squad Workout Hub</p>
      </div>
    </div>
    <a href="login.html" class="text-[11px] bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-3 py-1.5 rounded-lg border border-emerald-500 flex items-center gap-1.5 shadow transition active:scale-95">
      <i class="fa-solid fa-user text-[10px]"></i> Login
    </a>
  </header>

  <main class="p-4 space-y-5 flex-1">
    
    <section class="bg-gradient-to-br from-emerald-950/50 via-slate-900 to-slate-900 p-4 rounded-2xl border border-emerald-700/30 shadow-lg">
      <div class="flex items-center justify-between mb-2">
        <span class="text-[11px] font-bold text-emerald-400 uppercase tracking-widest flex items-center gap-1.5">
          <i class="fa-solid fa-bolt text-xs"></i> Daily Dose
        </span>
        <button onclick="getNewQuote()" class="text-slate-400 hover:text-emerald-400 transition text-xs p-1">
          <i class="fa-solid fa-rotate"></i>
        </button>
      </div>
      <p id="motivation-quote" class="text-xs font-medium text-slate-200 italic leading-relaxed">
        "The only bad workout is the one that didn't happen."
      </p>
    </section>

    <section>
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">My Gym Squad</h2>
        <div class="flex gap-2">
          <button onclick="shareSquad()" class="text-[11px] bg-emerald-900/60 text-emerald-300 border border-emerald-700/60 px-2.5 py-1 rounded-lg hover:bg-emerald-800 transition">
            <i class="fa-brands fa-whatsapp mr-1"></i>Invite
          </button>
          <button onclick="openAddFriendModal()" class="text-[11px] bg-emerald-600 text-white px-2.5 py-1 rounded-lg hover:bg-emerald-500 font-semibold transition">
            + Add Friend
          </button>
        </div>
      </div>
      
      <div id="friends-list" class="space-y-2.5"></div>
    </section>

    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg flex flex-col">
      <div class="flex items-center justify-between mb-2.5 pb-2 border-b border-slate-800/60">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-robot text-emerald-400 text-sm"></i>
          <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider">AI Fitness & Life Coach</h2>
        </div>
        <span class="text-[10px] text-slate-500 font-mono" id="model-indicator">Ready</span>
      </div>

      <div id="chat-box" class="h-44 overflow-y-auto space-y-2.5 mb-3 text-xs bg-slate-950/80 p-3 rounded-xl border border-slate-800/70">
        <div class="p-2.5 bg-slate-900 border border-slate-800 rounded-lg text-slate-300">
          <span class="font-bold text-emerald-400">Coach AI:</span> Bhai thak gaye ho ya motivation down ho rahi hai? Mujhse workout, diet ya energy boost tips lo!
        </div>
      </div>

      <form onsubmit="event.preventDefault(); sendMsg();" class="flex gap-2">
        <input id="user-msg" type="text" placeholder="Thakawat lag rahi hai, kya karu..." class="flex-1 bg-slate-950 border border-slate-700 text-xs px-3.5 py-2.5 rounded-xl focus:outline-none focus:border-emerald-500 text-slate-100 placeholder:text-slate-500">
        <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2.5 rounded-xl text-xs font-semibold text-white transition active:scale-95 shadow">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
